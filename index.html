<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f5f7"><title>车源雷达</title><style>
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",Arial;background:#f4f5f7;color:#111827}.shell{max-width:720px;margin:auto;padding:28px 16px 72px}.hero{padding:18px 4px}.hero b{font-size:11px;letter-spacing:.18em;color:#6366f1}.hero h1{font-size:38px;margin:8px 0 12px}.hero p{color:#6b7280;line-height:1.6}.status{display:inline-flex;align-items:center;gap:7px;margin-top:10px;background:#fff;padding:8px 12px;border-radius:999px;font-size:12px}.dot{width:7px;height:7px;border-radius:50%;background:#22c55e}.card{background:#fff;border-radius:22px;padding:20px;margin-top:16px;box-shadow:0 10px 30px #0000000c}.sectionHead{display:flex;align-items:center;justify-content:space-between;gap:12px}.sectionHead h2{margin:0;font-size:18px}.count{font-size:12px;color:#9ca3af}.addBtn{border:0;background:#111827;color:#fff;border-radius:13px;padding:10px 13px;font-weight:700;font-size:13px}.rules{margin-top:12px}.rule{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-top:1px solid #eee;padding:17px 0}.rule:first-child{border-top:0}.rule.off{opacity:.5}.ruleTitle{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.rule strong{font-size:17px}.tag{font-size:11px;background:#f3f4f6;color:#6b7280;border-radius:999px;padding:4px 7px}.rule p{font-size:13px;color:#6b7280;margin:7px 0 0;line-height:1.5}.actions{display:flex;gap:5px;flex-shrink:0}.actions button{font-size:11px;padding:7px 9px;border-radius:12px;border:0}.toggle{background:#ecfdf5;color:#047857}.del{background:#f9fafb;color:#9ca3af}.empty{color:#9ca3af;text-align:center;padding:30px 10px;line-height:1.7}.empty .big{font-size:28px;margin-bottom:7px}.formCard{display:none}.formCard.open{display:block}.formCard h2{margin:0 0 5px;font-size:18px}.hint{font-size:12px;color:#9ca3af;margin:0 0 17px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}label{font-size:12px;color:#6b7280;font-weight:600}input{width:100%;margin-top:6px;border:1px solid #e5e7eb;border-radius:13px;padding:13px;font-size:16px;background:#fafafa;outline:none}input:focus{border-color:#818cf8;background:#fff}.wide{grid-column:1/-1}.formActions{display:flex;gap:9px;margin-top:17px}.primary,.secondary{flex:1;padding:14px;border-radius:15px;border:0;font-weight:700}.primary{background:#111827;color:#fff}.secondary{background:#f3f4f6;color:#6b7280}.msg{font-size:13px;color:#4f46e5;text-align:center;margin-top:10px}.notifyRow{display:flex;justify-content:space-between;align-items:center;gap:12px}.notifyState{display:flex;align-items:center;gap:9px}.notifyDot{width:9px;height:9px;border-radius:50%;background:#d1d5db}.notifyDot.on{background:#22c55e}.notifyMeta{font-size:12px;color:#9ca3af;margin-top:3px}.notifyActions{display:flex;gap:8px}.notifyActions button{border:0;border-radius:12px;padding:9px 11px;font-size:12px;font-weight:650}.notifyPrimary{background:#111827;color:#fff}.notifyGhost{background:#f3f4f6;color:#6b7280}.notifyForm{display:none;margin-top:16px;padding-top:16px;border-top:1px solid #eee}.notifyForm.open{display:block}.notifyForm p{font-size:12px;color:#9ca3af;line-height:1.6;margin:0 0 12px}.notifyForm input{margin-top:0}footer{text-align:center;color:#aaa;font-size:11px;padding:26px}@media(max-width:520px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.rule{align-items:flex-start}.actions{flex-direction:column;align-items:flex-end}.sectionHead{align-items:center}}
</style></head><body><main class="shell"><header class="hero"><b>CAR RADAR</b><h1>车源雷达</h1><p>关注你想买的二手车，达到心理价位时提醒你。</p><div class="status"><span class="dot"></span><span id="status">监控服务接入中 · 0 个关注</span></div></header>
<section class="card"><div class="sectionHead"><div><h2>我的关注</h2><div class="count" id="count">0 条规则</div></div><button class="addBtn" id="showForm">＋ 添加关注</button></div><div class="rules" id="rules"><div class="empty">正在加载…</div></div></section>
<section class="card"><div class="sectionHead"><div><h2>消息通知</h2><div class="count">关闭网页也能收到提醒</div></div></div><div class="notifyRow" style="margin-top:16px"><div class="notifyState"><span class="notifyDot" id="notifyDot"></span><div><strong id="notifyTitle">未绑定</strong><div class="notifyMeta" id="notifyMeta">推荐绑定微信通知（Server酱）</div></div></div><div class="notifyActions"><button class="notifyPrimary" id="bindBtn">绑定微信</button><button class="notifyGhost" id="unbindBtn" style="display:none">解除</button></div></div><div class="notifyForm" id="notifyForm"><p><b>微信通知（推荐）</b><br>在 Server酱获取 SendKey，粘贴到下面。绑定时会立即发送一条微信测试消息。SendKey 只保存在后端，不会显示在网页源码中。</p><input id="serverchanKey" placeholder="SCT..."><div class="formActions"><button class="secondary" id="notifyCancel">取消</button><button class="primary" id="notifySave">绑定并测试</button></div><div class="msg" id="notifyMsg"></div><details style="margin-top:14px"><summary style="font-size:12px;color:#6b7280">使用 Bark 作为备用通知</summary><div style="padding-top:10px"><input id="barkEndpoint" placeholder="https://api.day.app/xxxxxxxx"><button class="secondary" id="barkSave" style="width:100%;margin-top:9px">绑定 Bark 并测试</button></div></details></div></section>
<section class="card formCard" id="formCard"><h2>添加关注</h2><p class="hint">每个车型都可以单独设置价格、年份和里程条件。</p><div class="grid"><label>品牌<input id="brand" value="保时捷"></label><label>车型<input id="model" value="911"></label><label class="wide">关键词（可选）<input id="keyword" placeholder="如 Carrera / 四驱 / 黑内"></label><label>最高价格（万元）<input id="price" inputmode="decimal" value="85"></label><label>最低年份<input id="year" inputmode="numeric" value="2021"></label><label>最大里程（万公里）<input id="mileage" inputmode="decimal" value="3"></label></div><div class="formActions"><button class="secondary" id="cancel">取消</button><button class="primary" id="add">保存关注</button></div><div class="msg" id="msg"></div></section>
<footer>无需注册 · 每台手机独立保存关注列表</footer></main><script>
const API='https://yhudaquqbvqmhyjyygrh.supabase.co/functions/v1/watch-rules'; const PUSH='https://yhudaquqbvqmhyjyygrh.supabase.co/functions/v1/push-settings'; const $=x=>document.getElementById(x); let did='';
function device(){const k='car-radar-device-v1';let x=localStorage.getItem(k);if(!x){x=crypto.randomUUID();localStorage.setItem(k,x)}return x}
async function req(url,method,body){const r=await fetch(url,{method,headers:{'content-type':'application/json','x-device-id':did},body:body?JSON.stringify(body):undefined});const d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d} async function api(method,body){return req(API,method,body)} async function pushApi(method,body){return req(PUSH,method,body)}
const esc=s=>String(s??'').replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]));
function openForm(){ $('formCard').classList.add('open'); setTimeout(()=>$('formCard').scrollIntoView({behavior:'smooth',block:'start'}),30)}
function closeForm(){ $('formCard').classList.remove('open'); $('msg').textContent=''}
async function load(){try{const a=await api('GET');const active=a.filter(x=>x.enabled).length;$('status').textContent='监控服务接入中 · '+active+' 个关注';$('count').textContent=a.length+' 条规则';$('rules').innerHTML=a.length?a.map(r=>'<div class="rule '+(r.enabled?'':'off')+'"><div><div class="ruleTitle"><strong>'+esc(r.brand)+' '+esc(r.model)+'</strong>'+(r.keyword?'<span class="tag">'+esc(r.keyword)+'</span>':'')+'</div><p>≤ '+r.max_price_wan+' 万'+(r.min_year?' · '+r.min_year+'+':'')+(r.max_mileage_wan?' · ≤ '+r.max_mileage_wan+' 万公里':'')+'</p></div><div class="actions"><button class="toggle" onclick="toggle(\''+r.id+'\','+(!r.enabled)+')">'+(r.enabled?'监控中':'已暂停')+'</button><button class="del" onclick="del(\''+r.id+'\')">删除</button></div></div>').join(''):'<div class="empty"><div class="big">＋</div>还没有关注车型<br>点击右上角“添加关注”开始</div>'}catch(e){$('rules').innerHTML='<div class="empty">加载失败：'+esc(e.message)+'</div>'}}
window.toggle=async(id,enabled)=>{try{await api('PATCH',{id,enabled});load()}catch(e){alert(e.message)}};window.del=async id=>{if(confirm('删除这条关注？')){try{await api('DELETE',{id});load()}catch(e){alert(e.message)}}};
async function loadPush(){try{const d=await pushApi('GET');if(d.bound){$('notifyDot').classList.add('on');$('notifyTitle').textContent=d.provider==='serverchan'?'微信通知已绑定':'Bark 已绑定';$('notifyMeta').textContent=d.last_test_ok?'测试通知已通过':'已绑定';$('bindBtn').textContent='重新绑定';$('unbindBtn').style.display='inline-block'}else{$('notifyDot').classList.remove('on');$('notifyTitle').textContent='未绑定';$('notifyMeta').textContent='推荐绑定微信通知（Server酱）';$('bindBtn').textContent='绑定微信';$('unbindBtn').style.display='none'}}catch(e){$('notifyMeta').textContent='通知状态加载失败'}}
function openNotify(){$('notifyForm').classList.add('open');setTimeout(()=>$('notifyForm').scrollIntoView({behavior:'smooth',block:'center'}),30)}
function closeNotify(){$('notifyForm').classList.remove('open');$('notifyMsg').textContent=''}
$('bindBtn').onclick=openNotify;$('notifyCancel').onclick=closeNotify;$('notifySave').onclick=async()=>{const b=$('notifySave');b.disabled=true;$('notifyMsg').textContent='正在发送微信测试消息…';try{await pushApi('POST',{provider:'serverchan',sendkey:$('serverchanKey').value});$('notifyMsg').textContent='绑定成功，请查看微信';await loadPush();setTimeout(closeNotify,1100)}catch(e){$('notifyMsg').textContent=e.message}finally{b.disabled=false}};$('barkSave').onclick=async()=>{const b=$('barkSave');b.disabled=true;$('notifyMsg').textContent='正在发送 Bark 测试通知…';try{await pushApi('POST',{provider:'bark',endpoint:$('barkEndpoint').value});$('notifyMsg').textContent='Bark 绑定成功';await loadPush();setTimeout(closeNotify,1100)}catch(e){$('notifyMsg').textContent=e.message}finally{b.disabled=false}};$('unbindBtn').onclick=async()=>{if(!confirm('解除消息通知绑定？'))return;try{await pushApi('DELETE');await loadPush()}catch(e){alert(e.message)}};
$('showForm').onclick=openForm;$('cancel').onclick=closeForm;
$('add').onclick=async()=>{const btn=$('add');btn.disabled=true;try{await api('POST',{brand:$('brand').value,model:$('model').value,keyword:$('keyword').value,max_price_wan:$('price').value,min_year:$('year').value,max_mileage_wan:$('mileage').value});$('msg').textContent='已保存关注';await load();setTimeout(closeForm,450)}catch(e){$('msg').textContent=e.message}finally{btn.disabled=false}};did=device();load();loadPush();
</script></body></html>
