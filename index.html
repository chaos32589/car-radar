<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b10"><title>美美&圆圆 dreamcar</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",Arial;background:#080b10;color:#f5f7fb}.shell{max-width:720px;margin:auto;padding:28px 16px 72px}.hero{padding:18px 4px}.hero b{font-size:11px;letter-spacing:.18em;color:#9da8ff}.hero h1{font-size:34px;margin:8px 0 12px}.hero p{color:#8f98a8;line-height:1.6}.status{display:inline-flex;align-items:center;gap:7px;margin-top:10px;background:#151a22;border:1px solid #232a35;padding:8px 12px;border-radius:999px;font-size:12px;color:#cbd2dd}.dot{width:7px;height:7px;border-radius:50%;background:#32d583}.dot.warn{background:#f5b942}.card{background:#11161e;border:1px solid #202733;border-radius:22px;padding:20px;margin-top:16px}.sectionHead{display:flex;align-items:center;justify-content:space-between;gap:12px}.sectionHead h2{margin:0;font-size:18px}.count,.hint{font-size:12px;color:#737d8e}.addBtn,.notifyPrimary{border:0;background:#f4f6f8;color:#0a0d12;border-radius:13px;padding:10px 13px;font-weight:700}.rule{border-top:1px solid #252c36;padding:17px 0}.rule:first-child{border-top:0}.rule.off{opacity:.5}.ruleTitleRow{display:flex;align-items:center;justify-content:space-between;gap:10px}.rule strong{font-size:17px;white-space:nowrap}.rule p{font-size:13px;color:#8993a3;margin:7px 0 0}.tag{font-size:11px;background:#222936;color:#aeb7c6;border-radius:999px;padding:4px 7px}.actionGroup{display:flex;align-items:center;overflow:hidden;border:1px solid #293240;border-radius:12px;background:#171d26;flex:none}.actionGroup button{border:0;border-left:1px solid #293240;background:transparent;color:#aeb7c6;font-size:11px;padding:8px 9px;white-space:nowrap}.actionGroup button:first-child{border-left:0}.actionGroup .toggle{color:#62e6ae;background:#102b23}.actionGroup .toggle.off{color:#aeb7c6;background:transparent}.actionGroup .edit{color:#b5c6ff}.actionGroup .del{color:#7e8898}.empty{color:#737d8e;text-align:center;padding:26px}.formCard,.notifyForm{display:none}.formCard.open,.notifyForm.open{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}label{font-size:12px;color:#9aa4b3;font-weight:600}input,select{width:100%;margin-top:6px;border:1px solid #303846;border-radius:13px;padding:13px;font-size:16px;background:#0c1118;color:#f5f7fb}.wide{grid-column:1/-1}.formActions{display:flex;gap:9px;margin-top:17px}.primary,.secondary{flex:1;padding:14px;border-radius:15px;border:0;font-weight:700}.primary{background:#f4f6f8}.secondary{background:#202630;color:#aeb7c6}.msg{font-size:13px;color:#9da8ff;text-align:center;margin-top:10px}.notifyRow{display:flex;justify-content:space-between;align-items:center;gap:12px}.notifyState{display:flex;align-items:center;gap:9px}.notifyDot{width:9px;height:9px;border-radius:50%;background:#3b4350}.notifyDot.on{background:#32d583}.notifyMeta{font-size:12px;color:#737d8e}.notifyActions{display:flex;gap:8px}.notifyActions button{border:0;border-radius:12px;padding:9px 11px;font-size:12px}.notifyGhost{background:#202630;color:#9aa4b3}.notifyForm{margin-top:16px;padding-top:16px;border-top:1px solid #252c36}.notifyTabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.notifyTabs button{padding:11px;border-radius:12px;border:1px solid #303846;background:#171d26;color:#9aa4b3}.notifyTabs button.active{background:#f4f6f8;color:#111}.refreshBtn{border:1px solid #303846;background:#171d26;color:#f5f7fb;border-radius:12px;padding:9px 11px;font-size:12px}.scanSummary{font-size:13px;color:#aeb7c6;line-height:1.7}.scanPill{display:inline-block;background:#171d26;border:1px solid #28303b;border-radius:999px;padding:5px 8px;font-size:11px;margin:4px 5px 0 0}.matchList{margin-top:12px;display:grid;gap:12px}.matchCard{display:block;text-decoration:none;color:inherit;border:1px solid #2b3340;border-radius:18px;background:#0c1118;overflow:hidden}.matchImages{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#151b24}.matchImages.one{grid-template-columns:1fr}.matchImages img{width:100%;height:112px;object-fit:cover;display:block}.imgPlaceholder{height:112px;display:flex;align-items:center;justify-content:center;color:#596273;font-size:12px;background:#151b24}.matchBody{padding:12px}.matchTop{display:flex;align-items:flex-start;gap:12px}.matchTitle{min-width:0;flex:1;font-size:14px;font-weight:750;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-top:2px}.priceWrap{flex:none;text-align:right}.priceLabel{font-size:9px;color:#737d8e;margin-bottom:3px}.matchPrice{display:flex;align-items:baseline;justify-content:flex-end;font-size:19px;font-weight:800;line-height:1}.matchPriceUnit{font-size:11px;font-weight:700;margin-left:2px;color:#d8dde6}.matchMeta{font-size:12px;color:#8f98a8;margin-top:9px;display:flex;gap:7px;flex-wrap:wrap}.matchLocation{color:#b5c6ff}.colorRow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.colorItem,.feeItem{background:#121821;border:1px solid #202936;border-radius:10px;padding:8px 10px}.miniLabel{font-size:9px;color:#657083;margin-bottom:3px}.miniValue{font-size:12px;color:#d8dee9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.feeRow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}.feeItem .miniValue{font-weight:700}.viewHint{text-align:right;color:#657083;font-size:10px;margin-top:9px}.matchCard:active{transform:scale(.997)}footer{text-align:center;color:#505968;font-size:11px;padding:26px}@media(max-width:520px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.sectionHead{align-items:flex-start}.ruleTitleRow{align-items:center}.rule strong{font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis}.actionGroup button{padding:7px 8px;font-size:10px}.matchImages img,.imgPlaceholder{height:104px}.matchTitle{font-size:13.5px}.matchPrice{font-size:18px}}</style></head><body><main class="shell"><header class="hero"><b>DREAMCAR</b><h1>美美&圆圆 dreamcar</h1><p>关注你想买的二手车，达到心理价位时提醒你。</p><div class="status"><span class="dot" id="statusDot"></span><span id="statusText">正在连接…</span></div></header><section class="card"><div class="sectionHead"><div><h2>我的关注</h2><div class="count" id="countText">0 条规则</div></div><button class="addBtn" id="showForm">＋ 添加关注</button></div><div id="rules"><div class="empty">正在加载…</div></div></section><section class="card"><div class="sectionHead"><div><h2>符合条件的车源</h2><div class="count" id="resultTime">正在读取上次结果</div></div><button class="refreshBtn" id="scanNow">刷新车源</button></div><div id="scanSummary" class="scanSummary"><div class="empty">正在加载车源…</div></div><div id="matches" class="matchList"></div></section><section class="card"><div class="sectionHead"><div><h2>消息通知</h2><div class="count">关闭网页也能收到提醒</div></div></div><div class="notifyRow" style="margin-top:16px"><div class="notifyState"><span class="notifyDot" id="notifyDot"></span><div><strong id="notifyTitle">未绑定</strong><div class="notifyMeta" id="notifyMeta">微信或 Bark 二选一</div></div></div><div class="notifyActions"><button class="notifyPrimary" id="bindBtn">绑定通知</button><button class="notifyGhost" id="unbindBtn" style="display:none">解除</button></div></div><div class="notifyForm" id="notifyForm"><div class="notifyTabs"><button id="tabWechat" class="active">微信 Server酱</button><button id="tabBark">Bark</button></div><p class="hint" id="notifyHint">粘贴 Server酱 SendKey，保存时会发送测试消息。</p><input id="notifyValue" type="password" autocomplete="off" placeholder="SCT••••••"><div class="formActions"><button class="secondary" id="notifyCancel">取消</button><button class="primary" id="notifySave">绑定并测试</button></div><div class="msg" id="notifyMsg"></div></div></section><section class="card formCard" id="formCard"><h2 id="formTitle">添加关注</h2><p class="hint">设置价格、年份和里程。</p><div class="grid"><label>品牌<select id="brand"></select></label><label>车型<select id="model"></select></label><label class="wide">关键词（可选）<input id="keyword" placeholder="如 Carrera / 四驱 / 黑内"></label><label>最高价格（万元）<input id="price" inputmode="decimal" value="85"></label><label>最低年份<input id="year" inputmode="numeric" value="2021"></label><label>最大里程（万公里）<input id="mileage" inputmode="decimal" value="3"></label></div><div class="formActions"><button class="secondary" id="cancel">取消</button><button class="primary" id="saveRule">保存关注</button></div><div class="msg" id="formMsg"></div></section><footer>美美&圆圆 dreamcar · 每台手机独立保存关注列表</footer></main><script>const BASE='https://yhudaquqbvqmhyjyygrh.supabase.co/functions/v1/',API=BASE+'watch-rules',PUSH=BASE+'push-settings',SCAN=BASE+'scan-now',LATEST=BASE+'scan-latest',$=id=>document.getElementById(id),els={status:$('statusText'),statusDot:$('statusDot'),count:$('countText'),rules:$('rules'),showForm:$('showForm'),formCard:$('formCard'),formTitle:$('formTitle'),brand:$('brand'),model:$('model'),keyword:$('keyword'),price:$('price'),year:$('year'),mileage:$('mileage'),cancel:$('cancel'),saveRule:$('saveRule'),formMsg:$('formMsg'),scanNow:$('scanNow'),scanSummary:$('scanSummary'),matches:$('matches'),resultTime:$('resultTime'),notifyDot:$('notifyDot'),notifyTitle:$('notifyTitle'),notifyMeta:$('notifyMeta'),bindBtn:$('bindBtn'),unbindBtn:$('unbindBtn'),notifyForm:$('notifyForm'),tabWechat:$('tabWechat'),tabBark:$('tabBark'),notifyHint:$('notifyHint'),notifyValue:$('notifyValue'),notifyCancel:$('notifyCancel'),notifySave:$('notifySave'),notifyMsg:$('notifyMsg')};let did='',allRules=[],editingId=null,notifyProvider='serverchan';const CARS={'保时捷':['911','718','Macan','Cayenne','Panamera','Taycan'],'奔驰':['GLE级','GLC级','GLK级','GLS级','G级','C级','E级','S级','迈巴赫GLS','威霆'],'宝马':['3系','4系','5系','7系','8系','M2','M3','M4','M5','X1','X2','X3','X4','X5','X6','X7','Z4'],'路虎':['揽胜','揽胜运动','揽胜星脉','揽胜极光','路虎卫士','发现运动','路虎发现']};function device(){let x=localStorage.getItem('car-radar-device-v1');if(!x){x=crypto.randomUUID();localStorage.setItem('car-radar-device-v1',x)}return x}async function req(url,method='GET',body){const r=await fetch(url,{method,headers:{'content-type':'application/json','x-device-id':did},body:body?JSON.stringify(body):undefined});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'请求失败');return d}const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));function fillBrands(v='保时捷'){els.brand.innerHTML=Object.keys(CARS).map(x=>'<option>'+x+'</option>').join('');els.brand.value=CARS[v]?v:'保时捷';fillModels()}function fillModels(v){els.model.innerHTML=CARS[els.brand.value].map(x=>'<option>'+x+'</option>').join('');if(v&&CARS[els.brand.value].includes(v))els.model.value=v}els.brand.addEventListener('change',()=>fillModels());function openAdd(){editingId=null;fillBrands();els.model.value='911';els.keyword.value='';els.price.value='85';els.year.value='2021';els.mileage.value='3';els.formTitle.textContent='添加关注';els.formMsg.textContent='';els.formCard.classList.add('open');els.formCard.scrollIntoView({behavior:'smooth',block:'start'})}function openEdit(id){const r=allRules.find(x=>String(x.id)===String(id));if(!r)return;editingId=r.id;fillBrands(r.brand);fillModels(r.model);els.keyword.value=r.keyword||'';els.price.value=r.max_price_wan??'';els.year.value=r.min_year??'';els.mileage.value=r.max_mileage_wan??'';els.formTitle.textContent='编辑关注';els.formMsg.textContent='';els.formCard.classList.add('open');els.formCard.scrollIntoView({behavior:'smooth',block:'start'})}function closeForm(){editingId=null;els.formCard.classList.remove('open');els.formMsg.textContent=''}function renderRules(){const active=allRules.filter(x=>x.enabled).length;els.status.textContent='监控中 · '+active+' 个关注';els.statusDot.classList.remove('warn');els.count.textContent=allRules.length+' 条规则';if(!allRules.length){els.rules.innerHTML='<div class="empty">还没有关注车型</div>';return}els.rules.innerHTML=allRules.map(r=>'<div class="rule '+(r.enabled?'':'off')+'" data-rule-id="'+esc(r.id)+'"><div class="ruleTitleRow"><strong>'+esc(r.brand)+' '+esc(r.model)+'</strong><div class="actionGroup"><button class="toggle '+(r.enabled?'':'off')+'" data-action="toggle">'+(r.enabled?'监控中':'已暂停')+'</button><button class="edit" data-action="edit">编辑</button><button class="del" data-action="delete">删除</button></div></div>'+(r.keyword?'<span class="tag">'+esc(r.keyword)+'</span>':'')+'<p>≤ '+r.max_price_wan+'万'+(r.min_year?' · '+r.min_year+'+':'')+(r.max_mileage_wan?' · ≤'+r.max_mileage_wan+'万公里':'')+'</p></div>').join('')}async function loadRules(){try{allRules=await req(API);renderRules()}catch(e){els.status.textContent='连接异常';els.statusDot.classList.add('warn');els.rules.innerHTML='<div class="empty">关注列表加载失败，请稍后刷新</div>'}}els.rules.addEventListener('click',async e=>{const btn=e.target.closest('button[data-action]');if(!btn)return;const row=btn.closest('[data-rule-id]');if(!row)return;const id=row.dataset.ruleId,rule=allRules.find(x=>String(x.id)===String(id));if(!rule)return;const action=btn.dataset.action;if(action==='edit'){openEdit(id);return}if(action==='delete'){if(!confirm('删除这条关注？'))return;btn.disabled=true;try{await req(API,'DELETE',{id:rule.id});await loadRules();refreshResults(false)}finally{btn.disabled=false}return}if(action==='toggle'){btn.disabled=true;try{await req(API,'PATCH',{id:rule.id,enabled:!rule.enabled});await loadRules();refreshResults(false)}finally{btn.disabled=false}}});function money(v){return v==null?'—':Number(v).toLocaleString('zh-CN')+'元'}function imagesHtml(m){const imgs=[m.exterior_image,m.interior_image].filter(Boolean);if(!imgs.length)return '<div class="imgPlaceholder">暂无车辆图片</div>';return '<div class="matchImages '+(imgs.length===1?'one':'')+'">'+imgs.map((u,i)=>'<img loading="lazy" src="'+esc(u)+'" alt="'+(i===0?'车辆外观':'车辆内饰')+'">').join('')+'</div>'}function renderResults(d){if(!d?.has_result&&d?.has_result!==undefined){els.scanSummary.innerHTML='<div class="empty">还没有扫描记录，正在自动检查…</div>';els.matches.innerHTML='';return}const stats=Object.entries(d.rule_stats||{}).map(([k,v])=>'<span class="scanPill">'+esc(k)+' '+(v==null?'待映射':v+'辆')+'</span>').join('');els.scanSummary.innerHTML='<strong>当前结果</strong><br>扫描车源：'+(d.fetched_count||0)+' 辆 · 符合条件：'+(d.matched_count||0)+' 辆<div>'+stats+'</div>';els.resultTime.textContent=d.scanned_at?'最近更新 '+new Date(d.scanned_at).toLocaleString():'正在更新';const list=d.matches||[];els.matches.innerHTML=list.length?list.map(m=>'<a class="matchCard" href="'+esc(m.url)+'" target="_blank" rel="noopener">'+imagesHtml(m)+'<div class="matchBody"><div class="matchTop"><div class="matchTitle">'+esc(m.title)+'</div><div class="priceWrap"><div class="priceLabel">车价</div><div class="matchPrice"><span>'+m.price_wan+'</span><span class="matchPriceUnit">万</span></div></div></div><div class="matchMeta"><span>'+(m.year||'年份未知')+'</span><span>·</span><span>'+(m.mileage_km!=null?(m.mileage_km/10000).toFixed(2)+'万公里':'里程未知')+'</span>'+(m.location?'<span>·</span><span class="matchLocation">'+esc(m.location)+'</span>':'')+'</div><div class="colorRow"><div class="colorItem"><div class="miniLabel">外观颜色</div><div class="miniValue">'+esc(m.exterior_color||'—')+'</div></div><div class="colorItem"><div class="miniLabel">内饰颜色</div><div class="miniValue">'+esc(m.interior_color||'—')+'</div></div></div><div class="feeRow"><div class="feeItem"><div class="miniLabel">整备服务费</div><div class="miniValue">'+money(m.service_fee_yuan)+'</div></div><div class="feeItem"><div class="miniLabel">质保费</div><div class="miniValue">'+money(m.warranty_fee_yuan)+'</div></div></div><div class="viewHint">点击查看澳康达详情 ›</div></div></a>').join(''):'<div class="empty">目前没有符合你条件的车源</div>'}async function loadLatest(){try{const d=await req(LATEST);renderResults(d);return d}catch(e){els.scanSummary.innerHTML='<div class="empty">读取结果失败</div>';return null}}async function refreshResults(showBusy=false){if(showBusy){els.scanNow.disabled=true;els.scanNow.textContent='正在核对详情…'}try{const d=await req(SCAN,'POST',{});renderResults(d)}catch(e){els.scanSummary.innerHTML='<div class="empty">刷新失败：'+esc(e.message)+'</div>'}finally{els.scanNow.disabled=false;els.scanNow.textContent='刷新车源'}}async function autoRefresh(){const d=await loadLatest(),old=!d?.scanned_at||Date.now()-new Date(d.scanned_at).getTime()>60*60*1000;if(old)refreshResults(false)}function setNotifyProvider(p){notifyProvider=p;els.tabWechat.classList.toggle('active',p==='serverchan');els.tabBark.classList.toggle('active',p==='bark');els.notifyHint.textContent=p==='serverchan'?'粘贴 Server酱 SendKey，保存时会发送测试消息。':'粘贴 Bark 首页第一张卡片地址，例如 https://api.day.app/你的Key';els.notifyValue.placeholder=p==='serverchan'?'SCT••••••':'https://api.day.app/••••••'}els.tabWechat.addEventListener('click',()=>setNotifyProvider('serverchan'));els.tabBark.addEventListener('click',()=>setNotifyProvider('bark'));els.bindBtn.addEventListener('click',()=>els.notifyForm.classList.add('open'));els.notifyCancel.addEventListener('click',()=>els.notifyForm.classList.remove('open'));els.notifySave.addEventListener('click',async()=>{els.notifyMsg.textContent='正在发送测试通知…';try{const body=notifyProvider==='serverchan'?{provider:'serverchan',sendkey:els.notifyValue.value}:{provider:'bark',endpoint:els.notifyValue.value};await req(PUSH,'POST',body);els.notifyMsg.textContent='绑定成功，请检查手机通知';await loadPush()}catch(e){els.notifyMsg.textContent=e.message}});els.unbindBtn.addEventListener('click',async()=>{if(confirm('解除通知绑定？')){await req(PUSH,'DELETE');location.reload()}});async function loadPush(){try{const d=await req(PUSH);if(d.bound){els.notifyDot.classList.add('on');els.notifyTitle.textContent=d.provider==='bark'?'Bark 已绑定':'微信通知已绑定';els.notifyMeta.textContent=d.last_test_ok?'测试通知已通过':'已绑定';els.bindBtn.textContent='重新绑定';els.unbindBtn.style.display='inline-block';els.notifyForm.classList.remove('open')}}catch(e){els.notifyMeta.textContent='通知状态加载失败'}}els.scanNow.addEventListener('click',()=>refreshResults(true));els.showForm.addEventListener('click',openAdd);els.cancel.addEventListener('click',closeForm);els.saveRule.addEventListener('click',async()=>{els.formMsg.textContent='';try{const body={brand:els.brand.value,model:els.model.value,keyword:els.keyword.value,max_price_wan:els.price.value,min_year:els.year.value,max_mileage_wan:els.mileage.value};if(editingId)await req(API,'PATCH',{id:editingId,...body});else await req(API,'POST',body);closeForm();await loadRules();refreshResults(false)}catch(e){els.formMsg.textContent=e.message}});did=device();fillBrands();loadRules();loadPush();autoRefresh();</script></body></html>
