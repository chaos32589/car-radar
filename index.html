roup .toggle.off{color:#aeb7c6;background:transparent}.actionGroup .edit{color:#b5c6ff}.actionGroup .del{color:#7e8898}.empty{color:#737d8e;text-align:center;padding:26px}.formCard,.notifyForm{display:none}.formCard.open,.notifyForm.open{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}label{font-size:12px;color:#9aa4b3;font-weight:600}input,select{width:100%;margin-top:6px;border:1px solid #303846;border-radius:13px;padding:13px;font-size:16px;background:#0c1118;color:#f5f7fb}.wide{grid-column:1/-1}.formActions{display:flex;gap:9px;margin-top:17px}.primary,.secondary{flex:1;padding:14px;border-radius:15px;border:0;font-weight:700}.primary{background:#f4f6f8}.secondary{background:#202630;color:#aeb7c6}.msg{font-size:13px;color:#9da8ff;text-align:center;margin-top:10px}.notifyRow{display:flex;justify-content:space-between;align-items:center;gap:12px}.notifyState{display:flex;align-items:center;gap:9px}.notifyDot{width:9px;height:9px;border-radius:50%;background:#3b4350}.notifyDot.on{background:#32d583}.notifyMeta{font-size:12px;color:#737d8e}.notifyActions{display:flex;gap:8px}.notifyActions button{border:0;border-radius:12px;padding:9px 11px;font-size:12px}.notifyGhost{background:#202630;color:#9aa4b3}.notifyForm{margin-top:16px;padding-top:16px;border-top:1px solid #252c36}.notifyTabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.notifyTabs button{padding:11px;border-radius:12px;border:1px solid #303846;background:#171d26;color:#9aa4b3}.notifyTabs button.active{background:#f4f6f8;color:#111}.refreshBtn{border:1px solid #303846;background:#171d26;color:#f5f7fb;border-radius:12px;padding:9px 11px;font-size:12px}.scanSummary{font-size:13px;color:#aeb7c6;line-height:1.7}.vehicleFilters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;overflow:visible;padding:10px 0 1px}.vehicleFilter{appearance:none;width:100%;min-width:0;border:1px solid #2b3340;background:#171d26;color:#aeb7c6;border-radius:13px;padding:8px;text-align:left;overflow:hidden}.vehicleFilter.active{background:#20263d;border-color:#6674d9;color:#fff;box-shadow:inset 0 0 0 1px rgba(157,168,255,.18)}.vehicleFilterTitle{font-size:11px;font-weight:760;color:#e7ebf2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vehicleFilterMeta{font-size:9px;color:#7f8998;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vehicleFilter.active .vehicleFilterMeta{color:#aeb8ff}.filterHint{font-size:10px;color:#687284;margin-top:5px}.matchList{margin-top:12px;display:grid;gap:14px}.matchCard{display:block;text-decoration:none;color:inherit;border:1px solid #2b3340;border-radius:18px;background:#0c1118;overflow:hidden}.matchImages{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:#eef0f2}.matchImages.one{grid-template-columns:1fr}.matchImages img{width:100%;height:138px;display:block;background:#eef0f2}.matchImages img:first-child{object-fit:contain}.matchImages img:nth-child(2){object-fit:cover}.imgPlaceholder{height:138px;display:flex;align-items:center;justify-content:center;color:#596273;background:#151b24}.matchBody{padding:14px}.matchTitle{font-size:17px;font-weight:800;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.matchIndex{font-size:14px;color:#7f8998;font-weight:800;margin-right:7px}.metaGrid{display:grid;grid-template-columns:1.35fr .8fr 1.05fr .8fr 1.15fr 1.15fr;gap:8px;margin-top:13px}.metaItem{min-width:0;display:grid;grid-template-rows:12px 26px;row-gap:5px}.metaLabel{font-size:9px;color:#657083;line-height:12px;height:12px;white-space:nowrap}.metaValue{height:26px;display:flex;align-items:center;font-size:13px;color:#d5dbe5;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.metaItem.price .metaValue{color:#f5f7fb;font-size:18px;font-weight:850;overflow:visible}.metaItem.price small{font-size:10px;margin-left:2px}footer{text-align:center;color:#505968;font-size:11px;padding:26px}@media(max-width:520px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.rule strong{font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis}.actionGroup button{padding:7px 8px;font-size:10px}.vehicleFilters{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.vehicleFilter{padding:8px 6px}.vehicleFilterTitle{font-size:10.5px}.vehicleFilterMeta{font-size:8.5px}.matchImages img,.imgPlaceholder{height:124px}.matchTitle{font-size:16px}.metaGrid{grid-template-columns:1.35fr .75fr 1.05fr .8fr 1.1fr 1.1fr;gap:6px}.metaValue{font-size:12px}.metaItem.price .metaValue{font-size:17px}}</style></head><body><main class="shell"><header class="hero"><b>DREAMCAR</b><h1>美美&圆圆 dreamcar</h1><p>关注你想买的二手车，达到心理价位时提醒你。</p><div class="status"><span class="dot" id="statusDot"></span><span id="statusText">正在连接…</span></div></header><section class="card"><div class="sectionHead"><div><h2>我的关注</h2><div class="count" id="countText">0 条规则</div></div><button class="addBtn" id="showForm">＋ 添加关注</button></div><div id="rules"><div class="empty">正在加载…</div></div></section><section class="card"><div class="sectionHead"><div><h2>符合条件的车源</h2><div class="count" id="resultTime">正在读取上次结果</div></div><button class="refreshBtn" id="scanNow">刷新车源</button></div><div id="scanSummary" class="scanSummary"><div class="empty">正在加载车源…</div></div><div id="matches" class="matchList"></div></section><section class="card"><div class="sectionHead"><div><h2>消息通知</h2><div class="count">关闭网页也能收到提醒</div></div></div><div class="notifyRow" style="margin-top:16px"><div class="notifyState"><span class="notifyDot" id="notifyDot"></span><div><strong id="notifyTitle">未绑定</strong><div class="notifyMeta" id="notifyMeta">微信或 Bark 二选一</div></div></div><div class="notifyActions"><button class="notifyPrimary" id="bindBtn">绑定通知</button><button class="notifyGhost" id="unbindBtn" style="display:none">解除</button></div></div><div class="notifyForm" id="notifyForm"><div class="notifyTabs"><button id="tabWechat" class="active">微信 Server酱</button><button id="tabBark">Bark</button></div><p class="hint" id="notifyHint">粘贴 Server酱 SendKey，保存时会发送测试消息。</p><input id="notifyValue" type="password" autocomplete="off" placeholder="SCT••••••"><div class="formActions"><button class="secondary" id="notifyCancel">取消</button><button class="primary" id="notifySave">绑定并测试</button></div><div class="msg" id="notifyMsg"></div></div></section><section class="card formCard" id="formCard"><h2 id="formTitle">添加关注</h2><p class="hint">设置价格、年份和里程。</p><div class="grid"><label>品牌<select id="brand"></select></label><label>车型<select id="model"></select></label><label class="wide">关键词（可选）<input id="keyword" placeholder="如 Carrera / 四驱 / 黑内"></label><label>最高价格（万元）<input id="price" inputmode="decimal" value="85"></label><label>最低年份<input id="year" inputmode="numeric" value="2021"></label><label>最大里程（万公里）<input id="mileage" inputmode="decimal" value="3"></label></div><div class="formActions"><button class="secondary" id="cancel">取消</button><button class="primary" id="saveRule">保存关注</button></div><div class="msg" id="formMsg"></div></section><footer>美美&圆圆 dreamcar · 共享关注列表</footer></main><script src="shared.js?v=8"></script><script>const BASE='https://yhudaquqbvqmhyjyygrh.supabase.co/functions/v1/',API=BASE+'watch-rules',PUSH=BASE+'push-settings',SCAN=BASE+'scan-now',LATEST=BASE+'scan-latest',$=id=>document.getElementById(id),els={status:$('statusText'),statusDot:$('statusDot'),count:$('countText'),rules:$('rules'),showForm:$('showForm'),formCard:$('formCard'),formTitle:$('formTitle'),brand:$('brand'),model:$('model'),keyword:$('keyword'),price:$('price'),year:$('year'),mileage:$('mileage'),cancel:$('cancel'),saveRule:$('saveRule'),formMsg:$('formMsg'),scanNow:$('scanNow'),scanSummary:$('scanSummary'),matches:$('matches'),resultTime:$('resultTime'),notifyDot:$('notifyDot'),notifyTitle:$('notifyTitle'),notifyMeta:$('notifyMeta'),bindBtn:$('bindBtn'),unbindBtn:$('unbindBtn'),notifyForm:$('notifyForm'),tabWechat:$('tabWechat'),tabBark:$('tabBark'),notifyHint:$('notifyHint'),notifyValue:$('notifyValue'),notifyCancel:$('notifyCancel'),notifySave:$('notifySave'),notifyMsg:$('notifyMsg')};let did='',allRules=[],editingId=null,notifyProvider='serverchan',activeFilter='all',latestResult=null;const CARS={'保时捷':['911','718','Macan','Cayenne','Panamera','Taycan'],'奔驰':['GLE级','GLC级','GLS级','G级','C级','E级','S级'],'宝马':['3系','4系','5系','5系GT','6系GT','7系','8系','M2','M3','M4','M5','X1','X2','X3','X4','X5','X6','X7','Z4'],'路虎':['揽胜','揽胜运动','揽胜星脉','揽胜极光','路虎卫士','发现运动','路虎发现'],'蔚来':['ET5','ET5T','ET7','ES6','ES7','ES8','EC6','EC7']};function device(){let x=localStorage.getItem('car-radar-device-v1');if(!x){x=crypto.randomUUID();localStorage.setItem('car-radar-device-v1',x)}return x}async function req(url,method='GET',body){const r=await fetch(url,{method,headers:{'content-type':'application/json','x-device-id':did},body:body?JSON.stringify(body):undefined});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||'请求失败');return d}const esc=s=>String(s??'').replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));function fillBrands(v='保时捷'){els.brand.innerHTML=Object.keys(CARS).map(x=>'<option>'+x+'</option>').join('');els.brand.value=CARS[v]?v:'保时捷';fillModels()}function fillModels(v){els.model.innerHTML=CARS[els.brand.value].map(x=>'<option>'+x+'</option>').join('');if(v&&CARS[els.brand.value].includes(v))els.model.value=v}els.brand.onchange=()=>fillModels();function openAdd(){editingId=null;fillBrands();els.model.value='911';els.keyword.value='';els.price.value='85';els.year.value='2021';els.mileage.value='3';els.formTitle.textContent='添加关注';els.formMsg.textContent='';els.formCard.classList.add('open');els.formCard.scrollIntoView({behavior:'smooth'})}function openEdit(id){const r=allRules.find(x=>String(x.id)===String(id));if(!r)return;editingId=r.id;fillBrands(r.brand);fillModels(r.model);els.keyword.value=r.keyword||'';els.price.value=r.max_price_wan??'';els.year.value=r.min_year??'';els.mileage.value=r.max_mileage_wan??'';els.formTitle.textContent='编辑关注';els.formCard.classList.add('open');els.formCard.scrollIntoView({behavior:'smooth'})}function closeForm(){editingId=null;els.formCard.classList.remove('open')}function renderRules(){const active=allRules.filter(x=>x.enabled).length;els.status.textContent='监控中 · '+active+' 个关注';els.count.textContent=allRules.length+' 条规则';if(!allRules.length){els.rules.innerHTML='<div class="empty">还没有关注车型</div>';return}els.rules.innerHTML=allRules.map(r=>'<div class="rule '+(r.enabled?'':'off')+'" data-rule-id="'+esc(r.id)+'"><div class="ruleTitleRow"><strong>'+esc(r.brand)+' '+esc(r.model)+'</strong><div class="actionGroup"><button class="toggle '+(r.enabled?'':'off')+'" data-action="toggle">'+(r.enabled?'监控中':'已暂停')+'</button><button class="edit" data-action="edit">编辑</button><button class="del" data-action="delete">删除</button></div></div>'+(r.keyword?'<span class="tag">'+esc(r.keyword)+'</span>':'')+'<p>≤ '+r.max_price_wan+'万'+(r.min_year?' · '+r.min_year+'+':'')+(r.max_mileage_wan?' · ≤'+r.max_mileage_wan+'万公里':'')+'</p></div>').join('')}async function loadRules(){try{allRules=await req(API);renderRules()}catch{els.status.textContent='连接异常';els.statusDot.classList.add('warn')}}els.rules.onclick=async e=>{const b=e.target.closest('button[data-action]');if(!b)return;const row=b.closest('[data-rule-id]'),r=allRules.find(x=>String(x.id)===String(row.dataset.ruleId));if(!r)return;if(b.dataset.action==='edit')return openEdit(r.id);if(b.dataset.action==='delete'){if(!confirm('删除这条关注？'))return;await req(API,'DELETE',{id:r.id});await loadRules();return refreshResults(false)}if(b.dataset.action==='toggle'){await req(API,'PATCH',{id:r.id,enabled:!r.enabled});await loadRules();refreshResults(false)}};function imagesHtml(m){const imgs=[m.exterior_image,m.interior_image].filter(Boolean);if(!imgs.length)return '<div class="imgPlaceholder">暂无车辆图片</div>';return '<div class="matchImages '+(imgs.length===1?'one':'')+'">'+imgs.map((u,i)=>'<img loading="lazy" src="'+esc(u)+'" alt="'+(i?'车辆内饰':'车辆外观')+'">').join('')+'</div>'}function meta(label,value,cls=''){return '<div class="metaItem '+cls+'"><div class="metaLabel">'+label+'</div><div class="metaValue">'+value+'</div></div>'}function statGroups(d){const matches=d.matches||[];return Object.entries(d.rule_stats||{}).map(([label,total])=>{const i=label.indexOf(' '),brand=i<0?'':label.slice(0,i),model=i<0?label:label.slice(i+1),key=brand+'|||'+model,matched=matches.filter(m=>(m.brand||'')+'|||'+(m.model||'')===key).length;return{key,brand,model,total,matched}})}function filterBar(d){const gs=statGroups(d),sum=gs.reduce((s,g)=>s+(Number(g.total)||0),0),items=[{key:'all',brand:'全部车型',model:'',total:sum,matched:(d.matches||[]).length},...gs];return '<div class="vehicleFilters">'+items.map(x=>'<button type="button" class="vehicleFilter '+(activeFilter===x.key?'active':'')+'" data-filter="'+esc(x.key)+'"><div class="vehicleFilterTitle">'+esc(x.brand+(x.model?' '+x.model:''))+'</div><div class="vehicleFilterMeta">总 '+(x.total==null?'—':x.total)+' · 匹配 '+x.matched+'</div></button>').join('')+'</div>'}function renderResults(d){latestResult=d;if(!d?.has_result&&d?.has_result!==undefined){els.scanSummary.innerHTML='<div class="empty">还没有扫描记录</div>';els.matches.innerHTML='';return}const all=d.matches||[],groups=statGroups(d);if(activeFilter!=='all'&&!groups.some(g=>g.key===activeFilter))activeFilter='all';const list=activeFilter==='all'?all:all.filter(m=>(m.brand||'')+'|||'+(m.model||'')===activeFilter);const selected=groups.find(g=>g.key===activeFilter);els.scanSummary.innerHTML='<strong>当前结果</strong><br>扫描车源：'+(d.fetched_count||0)+' 辆 · 符合条件：'+all.length+' 辆'+filterBar(d)+'<div class="filterHint">'+(selected?'当前显示 '+esc(selected.brand+' '+selected.model)+' · '+list.length+' 辆':'当前显示全部 · '+list.length+' 辆')+'</div>';els.resultTime.textContent=d.scanned_at?'最近更新 '+new Date(d.scanned_at).toLocaleString():'正在更新';els.matches.innerHTML=list.length?list.map((m,i)=>'<a class="matchCard" href="'+esc(m.url)+'" target="_blank" rel="noopener">'+imagesHtml(m)+'<div class="matchBody"><div class="matchTitle"><span class="matchIndex">'+String(i+1).padStart(2,'0')+'</span>'+esc(m.title)+'</div><div class="metaGrid">'+meta('车价',m.price_wan+'<small>万</small>','price')+meta('年份',esc(m.year||'—'))+meta('里程',m.mileage_km!=null?(m.mileage_km/10000).toFixed(2)+'万':'—')+meta('地点',esc(m.location||'—'))+meta('外观颜色',esc(m.exterior_color||'—'))+meta('内饰颜色',esc(m.interior_color||'—'))+'</div></div></a>').join(''):'<div class="empty">目前没有符合你条件的车源</div>'}els.scanSummary.onclick=e=>{const b=e.target.closest('[data-filter]');if(!b)return;activeFilter=b.dataset.filter;if(latestResult)renderResults(latestResult)};async function loadLatest(){try{const d=await req(LATEST);renderResults(d);return d}catch{els.scanSummary.innerHTML='<div class="empty">读取结果失败</div>';return null}}async function refreshResults(busy=false){if(busy){els.scanNow.disabled=true;els.scanNow.textContent='正在核对详情…'}try{renderResults(await req(SCAN,'POST',{}))}catch(e){els.scanSummary.innerHTML='<div class="empty">刷新失败：'+esc(e.message)+'</div>'}finally{els.scanNow.disabled=false;els.scanNow.textContent='刷新车源'}}async function autoRefresh(){const d=await loadLatest();if(!d?.scanned_at||Date.now()-new Date(d.scanned_at).getTime()>3600000)refreshResults(false)}function setNotifyProvider(p){notifyProvider=p;els.tabWechat.classList.toggle('active',p==='serverchan');els.tabBark.classList.toggle('active',p==='bark');els.notifyHint.textContent=p==='serverchan'?'粘贴 Server酱 SendKey，保存时会发送测试消息。':'粘贴 Bark 首页第一张卡片地址';els.notifyValue.placeholder=p==='serverchan'?'SCT••••••':'https://api.day.app/••••••'}els.tabWechat.onclick=()=>setNotifyProvider('serverchan');els.tabBark.onclick=()=>setNotifyProvider('bark');els.bindBtn.onclick=()=>els.notifyForm.classList.add('open');els.notifyCancel.onclick=()=>els.notifyForm.classList.remove('open');els.notifySave.onclick=async()=>{els.notifyMsg.textContent='正在发送测试通知…';try{const body=notifyProvider==='serverchan'?{provider:'serverchan',sendkey:els.notifyValue.value}:{provider:'bark',endpoint:els.notifyValue.value};await req(PUSH,'POST',body);els.notifyMsg.textContent='绑定成功';await loadPush()}catch(e){els.notifyMsg.textContent=e.message}};els.unbindBtn.onclick=async()=>{if(confirm('解除通知绑定？')){await req(PUSH,'DELETE');location.reload()}};async function loadPush(){try{const d=await req(PUSH);if(d.bound){els.notifyDot.classList.add('on');els.notifyTitle.textContent=d.provider==='bark'?'Bark 已绑定':'微信通知已绑定';els.notifyMeta.textContent=d.last_test_ok?'测试通知已通过':'已绑定';els.bindBtn.textContent='重新绑定';els.unbindBtn.style.display='inline-block'}}catch{}}els.scanNow.onclick=()=>refreshResults(true);els.showForm.onclick=openAdd;els.cancel.onclick=closeForm;els.saveRule.onclick=async()=>{els.formMsg.textContent='';try{const body={brand:els.brand.value,model:els.model.value,keyword:els.keyword.value,max_price_wan:els.price.value,min_year:els.year.value,max_mileage_wan:els.mileage.value};if(editingId)await req(API,'PATCH',{id:editingId,...body});else await req(API,'POST',body);closeForm();await loadRules();refreshResults(false)}catch(e){els.formMsg.textContent=e.message}};did=device();fillBrands();loadRules();loadPush();autoRefresh();</script></body></html>
