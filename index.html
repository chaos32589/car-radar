<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b10"><title>美美&圆圆 dreamcar</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",Arial;background:#080b10;color:#f5f7fb}.shell{max-width:720px;margin:auto;padding:28px 16px 72px}.hero{padding:18px 4px}.hero b{font-size:11px;letter-spacing:.18em;color:#9da8ff}.hero h1{font-size:38px;margin:8px 0 12px;color:#fff}.hero p{color:#8f98a8;line-height:1.6}.status{display:inline-flex;align-items:center;gap:7px;margin-top:10px;background:#151a22;border:1px solid #232a35;padding:8px 12px;border-radius:999px;font-size:12px;color:#cbd2dd}.dot{width:7px;height:7px;border-radius:50%;background:#32d583;box-shadow:0 0 10px #32d58366}.card{background:#11161e;border:1px solid #202733;border-radius:22px;padding:20px;margin-top:16px;box-shadow:0 14px 36px #0006}.sectionHead{display:flex;align-items:center;justify-content:space-between;gap:12px}.sectionHead h2{margin:0;font-size:18px;color:#f8fafc}.count{font-size:12px;color:#737d8e}.addBtn{border:1px solid #353d4b;background:#f4f6f8;color:#0a0d12;border-radius:13px;padding:10px 13px;font-weight:700;font-size:13px}.rules{margin-top:12px}.rule{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-top:1px solid #252c36;padding:17px 0}.rule:first-child{border-top:0}.rule.off{opacity:.45}.ruleTitle{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.rule strong{font-size:17px;color:#fff}.tag{font-size:11px;background:#222936;color:#aeb7c6;border-radius:999px;padding:4px 7px}.rule p{font-size:13px;color:#8993a3;margin:7px 0 0;line-height:1.5}.actions{display:flex;gap:5px;flex-shrink:0}.actions button{font-size:11px;padding:7px 9px;border-radius:12px;border:0}.toggle{background:#123329;color:#62e6ae}.del{background:#1b2029;color:#7e8898}.empty{color:#737d8e;text-align:center;padding:30px 10px;line-height:1.7}.formCard{display:none}.formCard.open{display:block}.formCard h2{margin:0 0 5px;font-size:18px}.hint{font-size:12px;color:#737d8e;margin:0 0 17px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}label{font-size:12px;color:#9aa4b3;font-weight:600}input,select{width:100%;margin-top:6px;border:1px solid #303846;border-radius:13px;padding:13px;font-size:16px;background:#0c1118;outline:none;color:#f5f7fb}input::placeholder{color:#566071}select{appearance:auto}.wide{grid-column:1/-1}.formActions{display:flex;gap:9px;margin-top:17px}.primary,.secondary{flex:1;padding:14px;border-radius:15px;border:0;font-weight:700}.primary{background:#f4f6f8;color:#0a0d12}.secondary{background:#202630;color:#aeb7c6}.msg{font-size:13px;color:#9da8ff;text-align:center;margin-top:10px}.notifyRow{display:flex;justify-content:space-between;align-items:center;gap:12px}.notifyState{display:flex;align-items:center;gap:9px}.notifyDot{width:9px;height:9px;border-radius:50%;background:#3b4350}.notifyDot.on{background:#32d583;box-shadow:0 0 10px #32d58366}.notifyMeta{font-size:12px;color:#737d8e;margin-top:3px}.notifyActions{display:flex;gap:8px}.notifyActions button{border:0;border-radius:12px;padding:9px 11px;font-size:12px;font-weight:650}.notifyPrimary{background:#f4f6f8;color:#0a0d12}.notifyGhost{background:#202630;color:#9aa4b3}.notifyForm{display:none;margin-top:16px;padding-top:16px;border-top:1px solid #252c36}.notifyForm.open{display:block}.notifyForm p{font-size:12px;color:#7f8999;line-height:1.6;margin:0 0 12px}footer{text-align:center;color:#505968;font-size:11px;padding:26px}@media(max-width:520px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}.actions{flex-direction:column;align-items:flex-end}}</style></head><body><main class="shell"><header class="hero"><b>DREAMCAR</b><h1>美美&圆圆 dreamcar</h1><p>关注你想买的二手车，达到心理价位时提醒你。</p><div class="status"><span class="dot"></span><span id="status">每小时自动检查 · 0 个关注</span></div></header><section class="card"><div class="sectionHead"><div><h2>我的关注</h2><div class="count" id="count">0 条规则</div></div><button class="addBtn" id="showForm">＋ 添加关注</button></div><div class="rules" id="rules"><div class="empty">正在加载…</div></div></section><section class="card"><div class="sectionHead"><div><h2>消息通知</h2><div class="count">关闭网页也能收到提醒</div></div></div><div class="notifyRow" style="margin-top:16px"><div class="notifyState"><span class="notifyDot" id="notifyDot"></span><div><strong id="notifyTitle">未绑定</strong><div class="notifyMeta" id="notifyMeta">推荐绑定微信通知（Server酱）</div></div></div><div class="notifyActions"><button class="notifyPrimary" id="bindBtn">绑定微信</button><button class="notifyGhost" id="unbindBtn" style="display:none">解除</button></div></div><div class="notifyForm" id="notifyForm"><p><b>微信通知（推荐）</b><br>在 Server酱获取 SendKey，粘贴到下面。绑定时会立即发送一条微信测试消息。</p><input id="serverchanKey" placeholder="SCT..."><div class="formActions"><button class="secondary" id="notifyCancel">取消</button><button class="primary" id="notifySave">绑定并测试</button></div><div class="msg" id="notifyMsg"></div></div></section><section class="card formCard" id="formCard"><h2>添加关注</h2><p class="hint">先选品牌和车型，再设置价格、年份和里程。</p><div class="grid"><label>品牌<select id="brand"></select></label><label>车型<select id="model"></select></label><label class="wide">关键词（可选）<input id="keyword" placeholder="如 Carrera / 四驱 / 黑内"></label><label>最高价格（万元）<input id="price" inputmode="decimal" value="85"></label><label>最低年份<input id="year" inputmode="numeric" value="2021"></label><label>最大里程（万公里）<input id="mileage" inputmode="decimal" value="3"></label></div><div class="formActions"><button class="secondary" id="cancel">取消</button><button class="primary" id="add">保存关注</button></div><div class="msg" id="msg"></div></section><footer>美美&圆圆 dreamcar · 每台手机独立保存关注列表</footer></main><script>const API='https://yhudaquqbvqmhyjyygrh.supabase.co/functions/v1/watch-rules',PUSH='https://yhudaquqbvqmhyjyygrh.supabase.co/functions/v1/push-settings',$=x=>document.getElementById(x);let did='';const CARS={'保时捷':['911','718','Macan','Cayenne','Panamera','Taycan'],'奔驰':['GLE级','GLC级','GLK级','GLS级','G级','C级','E级','S级','迈巴赫GLS','威霆'],'宝马':['3系','4系','5系','7系','8系','M2','M3','M4','M5','X1','X2','X3','X4','X5','X6','X7','Z4'],'路虎':['揽胜','揽胜运动','揽胜星脉','揽胜极光','路虎卫士','发现运动','路虎发现']};function fillBrands(){brand.innerHTML=Object.keys(CARS).map(x=>'<option>'+x+'</option>').join('');brand.value='保时捷';fillModels()}function fillModels(){model.innerHTML=CARS[brand.value].map(x=>'<option>'+x+'</option>').join('');if(brand.value==='保时捷')model.value='911'}brand.onchange=fillModels;function device(){let x=localStorage.getItem('car-radar-device-v1');if(!x){x=crypto.randomUUID();localStorage.setItem('car-radar-device-v1',x)}return x}async function req(url,method,body){const r=await fetch(url,{method,headers:{'content-type':'application/json','x-device-id':did},body:body?JSON.stringify(body):undefined}),d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}const api=(m,b)=>req(API,m,b),pushApi=(m,b)=>req(PUSH,m,b),esc=s=>String(s??'').replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]));function openForm(){formCard.classList.add('open');setTimeout(()=>formCard.scrollIntoView({behavior:'smooth'}),30)}function closeForm(){formCard.classList.remove('open');msg.textContent=''}async function load(){try{const a=await api('GET'),active=a.filter(x=>x.enabled).length;status.textContent='每小时自动检查 · '+active+' 个关注';count.textContent=a.length+' 条规则';rules.innerHTML=a.length?a.map(r=>'<div class="rule '+(r.enabled?'':'off')+'"><div><div class="ruleTitle"><strong>'+esc(r.brand)+' '+esc(r.model)+'</strong>'+(r.keyword?'<span class="tag">'+esc(r.keyword)+'</span>':'')+'</div><p>≤ '+r.max_price_wan+' 万'+(r.min_year?' · '+r.min_year+'+':'')+(r.max_mileage_wan?' · ≤ '+r.max_mileage_wan+' 万公里':'')+'</p></div><div class="actions"><button class="toggle" onclick="toggle(\''+r.id+'\','+(!r.enabled)+')">'+(r.enabled?'监控中':'已暂停')+'</button><button class="del" onclick="delRule(\''+r.id+'\')">删除</button></div></div>').join(''):'<div class="empty">还没有关注车型<br>点击“添加关注”开始</div>'}catch(e){rules.innerHTML='<div class="empty">加载失败：'+esc(e.message)+'</div>'}}window.toggle=async(id,enabled)=>{await api('PATCH',{id,enabled});load()};window.delRule=async id=>{if(confirm('删除这条关注？')){await api('DELETE',{id});load()}};async function loadPush(){try{const d=await pushApi('GET');if(d.bound){notifyDot.classList.add('on');notifyTitle.textContent=d.provider==='serverchan'?'微信通知已绑定':'通知已绑定';notifyMeta.textContent=d.last_test_ok?'测试通知已通过':'已绑定';bindBtn.textContent='重新绑定';unbindBtn.style.display='inline-block'}}catch(e){notifyMeta.textContent='通知状态加载失败'}}bindBtn.onclick=()=>notifyForm.classList.add('open');notifyCancel.onclick=()=>notifyForm.classList.remove('open');notifySave.onclick=async()=>{notifyMsg.textContent='正在发送微信测试消息…';try{await pushApi('POST',{provider:'serverchan',sendkey:serverchanKey.value});notifyMsg.textContent='绑定成功，请查看微信';loadPush()}catch(e){notifyMsg.textContent=e.message}};unbindBtn.onclick=async()=>{if(confirm('解除消息通知绑定？')){await pushApi('DELETE');location.reload()}};showForm.onclick=openForm;cancel.onclick=closeForm;add.onclick=async()=>{add.disabled=true;try{await api('POST',{brand:brand.value,model:model.value,keyword:keyword.value,max_price_wan:price.value,min_year:year.value,max_mileage_wan:mileage.value});msg.textContent='已保存关注';await load();setTimeout(closeForm,400)}catch(e){msg.textContent=e.message}finally{add.disabled=false}};did=device();fillBrands();load();loadPush();</script></body></html>
