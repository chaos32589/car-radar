<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b10"><title>美美&圆圆 dreamcar</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",Arial;background:#080b10;color:#f5f7fb}.shell{max-width:720px;margin:auto;padding:28px 16px 72px}.hero{padding:18px 4px}.hero b{font-size:11px;letter-spacing:.18em;color:#9da8ff}.hero h1{font-size:34px;margin:8px 0 12px}.hero p{color:#8f98a8;line-height:1.6}.status{display:inline-flex;align-items:center;gap:7px;margin-top:10px;background:#151a22;border:1px solid #232a35;padding:8px 12px;border-radius:999px;font-size:12px;color:#cbd2dd}.dot{width:7px;height:7px;border-radius:50%;background:#32d583}.card{background:#11161e;border:1px solid #202733;border-radius:22px;padding:20px;margin-top:16px}.sectionHead{display:flex;align-items:center;justify-content:space-between;gap:12px}.sectionHead h2{margin:0;font-size:18px}.count,.hint{font-size:12px;color:#737d8e}.addBtn,.notifyPrimary{border:0;background:#f4f6f8;color:#0a0d12;border-radius:13px;padding:10px 13px;font-weight:700}.rule{display:flex;justify-content:space-between;gap:12px;border-top:1px solid #252c36;padding:17px 0}.rule:first-child{border-top:0}.rule.off{opacity:.45}.rule strong{font-size:17px}.rule p{font-size:13px;color:#8993a3;margin:7px 0 0}.tag{font-size:11px;background:#222936;color:#aeb7c6;border-radius:999px;padding:4px 7px}.actions{display:flex;gap:5px;flex-direction:column;align-items:flex-end}.actions button{font-size:11px;padding:7px 9px;border-radius:12px;border:0}.toggle{background:#123329;color:#62e6ae}.edit{background:#202a3a;color:#b5c6ff}.del{background:#1b2029;color:#7e8898}.empty{color:#737d8e;text-align:center;padding:26px}.formCard,.notifyForm{display:none}.formCard.open,.notifyForm.open{display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}label{font-size:12px;color:#9aa4b3;font-weight:600}input,select{width:100%;margin-top:6px;border:1px solid #303846;border-radius:13px;padding:13px;font-size:16px;background:#0c1118;color:#f5f7fb}.wide{grid-column:1/-1}.formActions{display:flex;gap:9px;margin-top:17px}.primary,.secondary{flex:1;padding:14px;border-radius:15px;border:0;font-weight:700}.primary{background:#f4f6f8}.secondary{background:#202630;color:#aeb7c6}.msg{font-size:13px;color:#9da8ff;text-align:center;margin-top:10px}.notifyRow{display:flex;justify-content:space-between;align-items:center;gap:12px}.notifyState{display:flex;align-items:center;gap:9px}.notifyDot{width:9px;height:9px;border-radius:50%;background:#3b4350}.notifyDot.on{background:#32d583}.notifyMeta{font-size:12px;color:#737d8e}.notifyActions{display:flex;gap:8px}.notifyActions button{border:0;border-radius:12px;padding:9px 11px;font-size:12px}.notifyGhost{background:#202630;color:#9aa4b3}.notifyForm{margin-top:16px;padding-top:16px;border-top:1px solid #252c36}.notifyTabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}.notifyTabs button{padding:11px;border-radius:12px;border:1px solid #303846;background:#171d26;color:#9aa4b3}.notifyTabs button.active{background:#f4f6f8;color:#111}.testBtn{width:100%;margin-top:14px;padding:14px;border:1px solid #303846;border-radius:15px;background:#171d26;color:#f5f7fb;font-weight:700}.scanResult{margin-top:12px;padding:13px;border-radius:14px;background:#0c1118;border:1px solid #252c36;color:#aeb7c6;font-size:13px;line-height:1.7;display:none}.scanResult.show{display:block}.scanResult strong{color:#fff}.scanPill{display:inline-block;background:#171d26;border:1px solid #28303b;border-radius:999px;padding:5px 8px;font-size:11px;margin:4px 5px 0 0}.matchList{margin-top:12px;display:grid;gap:9px}.matchCard{display:block;text-decoration:none;color:inherit;border:1px solid #2b3340;border-radius:15px;padding:12px}.matchTop{display:flex;justify-content:space-between;gap:10px}.matchPrice{font-size:17px;font-weight:800}.matchMeta{font-size:12px;color:#8f98a8;margin-top:6px}footer{text-align:center;color:#505968;font-size:11px;padding:26px}@media(max-width:520px){.grid{grid-template-columns:1fr}.wide{grid-column:auto}}</style></head><body><main class="shell"><header class="hero"><b>DREAMCAR</b><h1>美美&圆圆 dreamcar</h1><p>关注你想买的二手车，达到心理价位时提醒你。</p><div class="status"><span class="dot"></span><span id="status">监控中 · 0 个关注</span></div></header><section class="card"><div class="sectionHead"><div><h2>我的关注</h2><div class="count" id="count">0 条规则</div></div><button class="addBtn" id="showForm">＋ 添加关注</button></div><div id="rules"><div class="empty">正在加载…</div></div><button class="testBtn" id="scanNow">立即检查澳康达</button><div class="scanResult" id="scanResult"></div></section><section class="card"><div class="sectionHead"><div><h2>消息通知</h2><div class="count">关闭网页也能收到提醒</div></div></div><div class="notifyRow" style="margin-top:16px"><div class="notifyState"><span class="notifyDot" id="notifyDot"></span><div><strong id="notifyTitle">未绑定</strong><div class="notifyMeta" id="notifyMeta">微信或 Bark 二选一</div></div></div><div class="notifyActions"><button class="notifyPrimary" id="bindBtn">绑定通知</button><button class="notifyGhost" id="unbindBtn" style="display:none">解除</button></div></div><div class="notifyForm" id="notifyForm"><div class="notifyTabs"><button id="tabWechat" class="active">微信 Server酱</button><button id="tabBark">Bark</button></div><p class="hint" id="notifyHint">粘贴 Server酱 SendKey，保存时会发送测试消息。</p><input id="notifyValue" type="password" autocomplete="off" placeholder="SCT••••••"><div class="formActions"><button class="secondary" id="notifyCancel">取消</button><button class="primary" id="notifySave">绑定并测试</button></div><div class="msg" id="notifyMsg"></div></div></section><section class="card formCard" id="formCard"><h2 id="formTitle">添加关注</h2><p class="hint">设置价格、年份和里程。</p><div class="grid"><label>品牌<select id="brand"></select></label><label>车型<select id="model"></select></label><label class="wide">关键词（可选）<input id="keyword" placeholder="如 Carrera / 四驱 / 黑内"></label><label>最高价格（万元）<input id="price" inputmode="decimal" value="85"></label><label>最低年份<input id="year" inputmode="numeric" value="2021"></label><label>最大里程（万公里）<input id="mileage" inputmode="decimal" value="3"></label></div><div class="formActions"><button class="secondary" id="cancel">取消</button><button class="primary" id="add">保存关注</button></div><div class="msg" id="msg"></div></section><footer>美美&圆圆 dreamcar · 每台手机独立保存关注列表</footer></main><script>
const API='https://yhudaquqbvqmhyjyygrh.supabase.co/functions/v1/watch-rules',PUSH='https://yhudaquqbvqmhyjyygrh.supabase.co/functions/v1/push-settings',SCAN='https://yhudaquqbvqmhyjyygrh.supabase.co/functions/v1/scan-now',$=x=>document.getElementById(x);let did='',allRules=[],editingId=null,notifyProvider='serverchan';const CARS={'保时捷':['911','718','Macan','Cayenne','Panamera','Taycan'],'奔驰':['GLE级','GLC级','GLK级','GLS级','G级','C级','E级','S级','迈巴赫GLS','威霆'],'宝马':['3系','4系','5系','7系','8系','M2','M3','M4','M5','X1','X2','X3','X4','X5','X6','X7','Z4'],'路虎':['揽胜','揽胜运动','揽胜星脉','揽胜极光','路虎卫士','发现运动','路虎发现']};
function device(){let x=localStorage.getItem('car-radar-device-v1');if(!x){x=crypto.randomUUID();localStorage.setItem('car-radar-device-v1',x)}return x}async function req(url,method,body){const r=await fetch(url,{method,headers:{'content-type':'application/json','x-device-id':did},body:body?JSON.stringify(body):undefined}),d=await r.json();if(!r.ok)throw Error(d.error||'请求失败');return d}const api=(m,b)=>req(API,m,b),pushApi=(m,b)=>req(PUSH,m,b),esc=s=>String(s??'').replace(/[&<>]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[x]));
function fillBrands(v='保时捷'){brand.innerHTML=Object.keys(CARS).map(x=>'<option>'+x+'</option>').join('');brand.value=CARS[v]?v:'保时捷';fillModels()}function fillModels(v){model.innerHTML=CARS[brand.value].map(x=>'<option>'+x+'</option>').join('');if(v&&CARS[brand.value].includes(v))model.value=v}brand.onchange=()=>fillModels();function openAdd(){editingId=null;fillBrands();model.value='911';keyword.value='';price.value='85';year.value='2021';mileage.value='3';formTitle.textContent='添加关注';formCard.classList.add('open')}function openEdit(id){const r=allRules.find(x=>x.id===id);if(!r)return;editingId=id;fillBrands(r.brand);fillModels(r.model);keyword.value=r.keyword||'';price.value=r.max_price_wan||'';year.value=r.min_year||'';mileage.value=r.max_mileage_wan||'';formTitle.textContent='编辑关注';formCard.classList.add('open')}function closeForm(){editingId=null;formCard.classList.remove('open');msg.textContent=''}
async function load(){try{allRules=await api('GET');const active=allRules.filter(x=>x.enabled).length;status.textContent='监控中 · '+active+' 个关注';count.textContent=allRules.length+' 条规则';rules.innerHTML=allRules.length?allRules.map(r=>'<div class="rule '+(r.enabled?'':'off')+'"><div><strong>'+esc(r.brand)+' '+esc(r.model)+'</strong>'+(r.keyword?' <span class="tag">'+esc(r.keyword)+'</span>':'')+'<p>≤ '+r.max_price_wan+'万'+(r.min_year?' · '+r.min_year+'+':'')+(r.max_mileage_wan?' · ≤'+r.max_mileage_wan+'万公里':'')+'</p></div><div class="actions"><button class="toggle" onclick="toggle(\''+r.id+'\','+(!r.enabled)+')">'+(r.enabled?'监控中':'已暂停')+'</button><button class="edit" onclick="editRule(\''+r.id+'\')">编辑</button><button class="del" onclick="delRule(\''+r.id+'\')">删除</button></div></div>').join(''):'<div class="empty">还没有关注车型</div>'}catch(e){rules.innerHTML='<div class="empty">加载失败</div>'}}window.toggle=async(id,enabled)=>{await api('PATCH',{id,enabled});load()};window.editRule=openEdit;window.delRule=async id=>{if(confirm('删除这条关注？')){await api('DELETE',{id});load()}};
function setNotifyProvider(p){notifyProvider=p;tabWechat.classList.toggle('active',p==='serverchan');tabBark.classList.toggle('active',p==='bark');notifyHint.textContent=p==='serverchan'?'粘贴 Server酱 SendKey，保存时会发送测试消息。':'粘贴 Bark 首页第一张卡片的地址，例如 https://api.day.app/你的Key';notifyValue.placeholder=p==='serverchan'?'SCT••••••':'https://api.day.app/••••••'}tabWechat.onclick=()=>setNotifyProvider('serverchan');tabBark.onclick=()=>setNotifyProvider('bark');bindBtn.onclick=()=>notifyForm.classList.add('open');notifyCancel.onclick=()=>notifyForm.classList.remove('open');notifySave.onclick=async()=>{notifyMsg.textContent='正在发送测试通知…';try{const body=notifyProvider==='serverchan'?{provider:'serverchan',sendkey:notifyValue.value}:{provider:'bark',endpoint:notifyValue.value};await pushApi('POST',body);notifyMsg.textContent='绑定成功，请检查手机通知';await loadPush()}catch(e){notifyMsg.textContent=e.message}};unbindBtn.onclick=async()=>{if(confirm('解除通知绑定？')){await pushApi('DELETE');location.reload()}};async function loadPush(){try{const d=await pushApi('GET');if(d.bound){notifyDot.classList.add('on');notifyTitle.textContent=d.provider==='bark'?'Bark 已绑定':'微信通知已绑定';notifyMeta.textContent=d.last_test_ok?'测试通知已通过':'已绑定';bindBtn.textContent='重新绑定';unbindBtn.style.display='inline-block';notifyForm.classList.remove('open')}}catch(e){notifyMeta.textContent='通知状态加载失败'}}
function renderMatches(d){const stats=Object.entries(d.rule_stats||{}).map(([k,v])=>'<span class="scanPill">'+esc(k)+' '+v+'辆</span>').join('');const list=d.matches||[];const cards=list.slice(0,10).map(m=>'<a class="matchCard" href="'+m.url+'" target="_blank"><div class="matchTop"><strong>'+esc(m.title)+'</strong><span class="matchPrice">'+m.price_wan+'万</span></div><div class="matchMeta">'+(m.year||'年份未知')+' · '+(m.mileage_km?(m.mileage_km/10000).toFixed(2)+'万公里':'里程未知')+'</div></a>').join('');return '<strong>扫描完成</strong><br>完整翻页抓取：'+d.fetched_count+' 辆<br>符合你的条件：'+d.matched_count+' 辆<div>'+stats+'</div>'+(d.notification_count?'<div style="margin-top:8px">本次新提醒：'+d.notification_count+' 条</div>':'')+(cards?'<div class="matchList">'+cards+'</div>':'')}
scanNow.onclick=async()=>{scanNow.disabled=true;scanNow.textContent='正在完整翻页检查…';scanResult.classList.add('show');scanResult.innerHTML='正在读取澳康达全部相关分页，请稍候…';try{const d=await req(SCAN,'POST',{});scanResult.innerHTML=renderMatches(d)}catch(e){scanResult.innerHTML='检查失败：'+esc(e.message)}finally{scanNow.disabled=false;scanNow.textContent='立即检查澳康达'}};showForm.onclick=openAdd;cancel.onclick=closeForm;add.onclick=async()=>{try{const body={brand:brand.value,model:model.value,keyword:keyword.value,max_price_wan:price.value,min_year:year.value,max_mileage_wan:mileage.value};if(editingId)await api('PATCH',{id:editingId,...body});else await api('POST',body);closeForm();await load()}catch(e){msg.textContent=e.message}};did=device();fillBrands();load();loadPush();
</script></body></html>
