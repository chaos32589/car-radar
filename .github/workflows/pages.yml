name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Apply shared UI and three-column filter grid
        run: python - <<'PY'
from pathlib import Path
p=Path('index.html')
s=p.read_text()
s=s.replace('shared.js?v=4','shared.js?v=7').replace('shared.js?v=5','shared.js?v=7').replace('shared.js?v=6','shared.js?v=7')
css='''<style id="filter-grid-v2">
.vehicleFilters{display:grid!important;grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:7px!important;overflow:visible!important;padding:10px 0 1px!important;width:100%!important}
.vehicleFilter{box-sizing:border-box!important;width:100%!important;min-width:0!important;max-width:none!important;flex:none!important;padding:8px 8px!important;overflow:hidden!important}
.vehicleFilterTitle{font-size:11px!important;line-height:1.2!important;overflow:hidden!important;text-overflow:ellipsis!important;white-space:nowrap!important}
.vehicleFilterMeta{font-size:9px!important;line-height:1.2!important;overflow:hidden!important;text-overflow:ellipsis!important;white-space:nowrap!important}
@media(max-width:380px){.vehicleFilters{gap:6px!important}.vehicleFilter{padding:7px 6px!important}.vehicleFilterTitle{font-size:10.5px!important}.vehicleFilterMeta{font-size:8.5px!important}}
</style>'''
for old in ('filter-grid-v1','filter-grid-v2'):
    if old in s:
        import re
        s=re.sub(r'<style id="filter-grid-v[12]">.*?</style>','',s,flags=re.S)
        break
s=s.replace('</head>',css+'</head>',1)
p.write_text(s)
PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
